<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Painel Financeiro</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #0b1733; color: #eaf0ff;
      }
      .box { max-width: 420px; text-align: center; padding: 32px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #a9bbe0; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
      button {
        background: #2f6df6; color: #fff; border: 0; border-radius: 8px;
        padding: 10px 18px; font-size: 14px; cursor: pointer;
      }
      button:hover { background: #1f57d6; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Não foi possível conectar</h1>
      <p>
        O Painel Financeiro precisa de internet para carregar a versão mais recente
        dos dados. Verifique sua conexão e tente novamente.
      </p>
      <button onclick="console.log('retry-app-load')">Tentar novamente</button>
    </div>
  </body>
</html>
